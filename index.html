<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=100&h=100&fit=crop" alt="Travel Logo" class="logo">
            <h1>Welcome to Travel Explorer</h1>
            <p class="tagline">Discover Amazing Destinations</p>
            
            <form action="home.html" method="get" class="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                
                <button type="submit" class="btn-login">Login</button>
            </form>
            
            <div class="links">
                <a href="#" class="link">Forgot Password?</a>
                <span class="separator">|</span>
                <a href="#" class="link">Create Account</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
